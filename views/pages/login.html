<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brother Bean - Login</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/icons/brother-bean-logo-rounded.png"
    />
    <link rel="apple-touch-icon" href="/assets/icons/brother-bean-logo.jpg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/adminstyle.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Dancing+Script:wght@500;600&family=Montserrat:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="login-loading" class="ls-loading-overlay">
      <div class="ls-loading-card">
        <div class="ls-loading-spinner"></div>
        <div class="ls-loading-brand">Brother Bean</div>
        <div id="login-loading-text" class="ls-loading-text">Checking session...</div>
      </div>
    </div>

    <div id="login-screen" class="ls-screen">
      <div class="ls-left">
        <div class="ls-bg-shapes">
          <div class="ls-shape ls-shape-1"></div>
          <div class="ls-shape ls-shape-2"></div>
          <div class="ls-shape ls-shape-3"></div>
          <div class="ls-shape ls-shape-4"></div>
          <div class="ls-shape ls-shape-5"></div>
          <div class="ls-bean ls-bean-1">
            <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="28" rx="18" ry="26" fill="rgba(255,255,255,0.08)" /><path d="M20 6C20 6 14 18 14 28C14 38 20 50 20 50" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round"/><path d="M20 6C20 6 26 18 26 28C26 38 20 50 20 50" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-linecap="round"/></svg>
          </div>
          <div class="ls-bean ls-bean-2">
            <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="28" rx="18" ry="26" fill="rgba(255,255,255,0.06)" /><path d="M20 6C20 6 14 18 14 28C14 38 20 50 20 50" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="ls-bean ls-bean-3">
            <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="28" rx="18" ry="26" fill="rgba(255,255,255,0.07)" /><path d="M20 6C20 6 14 18 14 28C14 38 20 50 20 50" stroke="rgba(255,255,255,0.11)" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="ls-bean ls-bean-4">
            <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="28" rx="18" ry="26" fill="rgba(255,255,255,0.05)" /><path d="M20 6C20 6 14 18 14 28C14 38 20 50 20 50" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="ls-bean ls-bean-5">
            <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="28" rx="18" ry="26" fill="rgba(255,255,255,0.06)" /><path d="M20 6C20 6 14 18 14 28C14 38 20 50 20 50" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/><path d="M20 6C20 6 26 18 26 28C26 38 20 50 20 50" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-linecap="round"/></svg>
          </div>
          <div class="ls-bean ls-bean-6">
            <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="28" rx="18" ry="26" fill="rgba(255,255,255,0.04)" /><path d="M20 6C20 6 14 18 14 28C14 38 20 50 20 50" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="ls-bean ls-bean-7">
            <svg viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="28" rx="18" ry="26" fill="rgba(255,255,255,0.05)" /><path d="M20 6C20 6 14 18 14 28C14 38 20 50 20 50" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="ls-left-content">
          <div class="ls-logo">
            <img
              src="/assets/icons/brother-bean-logo-rounded.png"
              alt="Brother Bean Coffee House logo"
            />
          </div>
          <div class="ls-name">Brother Bean</div>
          <div class="ls-sub">Coffee House</div>
          <div class="ls-divider"></div>
          <div class="ls-portal">Brewed for Better Service</div>
        </div>
      </div>
      <div class="ls-right">
        <div class="ls-form-wrap">
          <div class="ls-title">Welcome <span class="ls-title-accent">back</span></div>
          <div class="ls-desc">Sign in to your account</div>

          <label class="ls-label" for="u">Email</label>
          <div class="ls-field">
            <svg class="ls-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input
              class="ls-input"
              type="email"
              id="u"
              name="email"
              placeholder="you@brotherbean.com"
              autocomplete="username email"
              inputmode="email"
            />
          </div>

          <label class="ls-label" for="p">Password</label>
          <div class="ls-password-wrap">
            <svg class="ls-field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input
              class="ls-input"
              type="password"
              id="p"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button
              class="ls-password-toggle"
              type="button"
              onclick="window.toggleLoginPassword()"
              aria-label="Show password"
              aria-controls="p"
              aria-pressed="false"
              id="togglePwdBtn"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <div class="ls-caps" id="capsWarn" aria-live="polite">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Caps Lock is on
          </div>

          <div class="ls-meta-row">
            <label class="ls-remember">
              <input type="checkbox" id="rememberEmail" />
              <span>Remember email</span>
            </label>
            <button
              class="ls-link-btn"
              type="button"
              onclick="window.forgotPasswordHelp()"
            >
              Forgot password?
            </button>
          </div>

          <div class="ls-error" id="err"></div>

          <button class="ls-btn" id="loginBtn" onclick="window.login()">
            <span id="loginBtnText">Sign In</span>
          </button>

          <div class="ls-status" id="loginStatus" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="/controllers/auth/loginController.js?v=20260405b"
    ></script>
  </body>
</html>
